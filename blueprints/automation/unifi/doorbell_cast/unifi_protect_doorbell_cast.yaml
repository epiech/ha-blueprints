blueprint:
  name: UniFi Protect Doorbell - Stream to Google Nest Hub / Cast Devices
  description: >
    When a UniFi Doorbell rings, automatically stream the live camera feed to one or more
    Google Nest Hubs or Cast-enabled displays, then stop the stream after a customizable timeout.
    If pressed again while streaming, the timer resets.
  domain: automation
  author: epiech
  source_url: https://github.com/epiech/ha-blueprints/blob/main/blueprints/automation/unifi/doorbell_cast/unifi_protect_doorbell_cast.yaml
  homeassistant:
    min_version: 2026.7.0
  input:
    doorbell_entity:
      name: Doorbell Ring Entity
      description: >
        The doorbell event entity from UniFi Protect (e.g. event.g4_doorbell_pro_poe_doorbell).
      selector:
        entity:
          filter:
            - integration: unifiprotect
              domain:
                - event
              device_class:
                - doorbell
          multiple: false
          reorder: false
    camera_entity:
      name: Doorbell Camera Entity
      description: The camera entity to stream (e.g. camera.g4_doorbell_pro_high_resolution_channel).
      selector:
        entity:
          filter:
            - domain:
                - camera
          multiple: false
          reorder: false
    cast_devices:
      name: Nest Hub / Cast Displays
      description: Select one or more Google Nest Hubs or Chromecast displays to stream to.
      selector:
        entity:
          filter:
            - domain:
                - media_player
              integration: cast
          multiple: true
          reorder: false
    stream_duration:
      name: Stream Duration (seconds)
      description: How long to display the live stream before stopping.
      default: 90
      selector:
        number:
          min: 15.0
          max: 300.0
          step: 5.0
          unit_of_measurement: s
          mode: slider
    custom_actions:
      name: Additional Actions (Optional)
      description: Extra actions to run when the doorbell rings (e.g., pause media, play a chime, send a notification).
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

triggers:
  - trigger: event.received
    target:
      entity_id: !input doorbell_entity
    options:
      event_type:
        - ring

conditions: []

actions:
  # 1. Execute any extra user actions first (e.g. chime, lights)
  - sequence: !input custom_actions

  # 2. Play live stream on all selected Cast devices
  - repeat:
      for_each: !input cast_devices
      sequence:
        - action: camera.play_stream
          target:
            entity_id: !input camera_entity
          data:
            media_player: "{{ repeat.item }}"
            format: hls

  # 3. Keep stream active for specified duration
  - delay:
      seconds: !input stream_duration

  # 4. Stop the stream on all selected Cast devices
  - repeat:
      for_each: !input cast_devices
      sequence:
        - action: media_player.media_stop
          target:
            entity_id: "{{ repeat.item }}"
