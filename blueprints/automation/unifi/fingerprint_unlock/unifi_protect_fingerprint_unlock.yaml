blueprint:
  name: UniFi Protect Doorbell - Unlock Smart Lock via Fingerprint
  description: >
    Unlocks a smart lock when an authorized fingerprint is identified on a UniFi Protect
    G4 Doorbell Pro. Hardened against reconnection replays, entity unavailability,
    and unrecognized fingerprints.
  domain: automation
  author: epiech
  homeassistant:
    min_version: 2024.4.0
  input:
    fingerprint_entity:
      name: Fingerprint Sensor Entity
      description: The fingerprint event entity from your UniFi Doorbell Pro (e.g. event.g4_doorbell_pro_fingerprint).
      selector:
        entity:
          filter:
            - domain: event
              integration: unifiprotect
    lock_entity:
      name: Smart Lock
      description: The smart lock to unlock when an authorized fingerprint is scanned.
      selector:
        entity:
          filter:
            - domain: lock
    notify_devices:
      name: Mobile App Notification (Optional)
      description: Mobile app devices to receive a push notification when the door is unlocked.
      default: []
      selector:
        device:
          filter:
            - integration: mobile_app
          multiple: true
    custom_actions:
      name: Additional Actions (Optional)
      description: Extra actions to run upon successful unlock (e.g., turn on a hallway light, play a chime, disarm an alarm).
      default: []
      selector:
        action: {}

mode: single

trigger:
  - platform: state
    entity_id: !input fingerprint_entity
    attribute: event_type
    to: "identified"

condition:
  # 1. Guard against restarts & reconnects (ignore transitions from unavailable/unknown)
  - condition: template
    value_template: >-
      {{ trigger.from_state is defined and
         trigger.from_state.state not in ['unavailable', 'unknown'] and
         trigger.to_state is defined and
         trigger.to_state.state not in ['unavailable', 'unknown'] }}

  # 2. Ensure state timestamp actually changed (not a restored/replayed attribute)
  - condition: template
    value_template: >-
      {{ trigger.from_state.state != trigger.to_state.state }}

  # 3. Check event freshness against the actual scan time (state ISO timestamp), not last_changed
  - condition: template
    value_template: >-
      {{ (as_timestamp(now()) - as_timestamp(trigger.to_state.state, default=0)) < 10 }}

  # 4. Filter out unknown fingerprints (must have a valid user ID / name attribute)
  - condition: template
    value_template: >-
      {{ trigger.to_state.attributes.user_id is defined and
         trigger.to_state.attributes.user_id not in ['', none, 'unknown'] }}

action:
  # 1. Unlock the door
  - action: lock.unlock
    target:
      entity_id: !input lock_entity

  # 2. Send push notifications if mobile devices were selected
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ notify_devices | length > 0 }}"
        sequence:
          - repeat:
              for_each: !input notify_devices
              sequence:
                - action: notify.send_message
                  target:
                    device_id: "{{ repeat.item }}"
                  data:
                    title: "🔓 Door Unlocked"
                    message: >-
                      Door unlocked by {{ trigger.to_state.attributes.full_name | default(trigger.to_state.attributes.user_id, true) }}.

  # 3. Execute any user-defined additional actions
  - sequence: !input custom_actions
